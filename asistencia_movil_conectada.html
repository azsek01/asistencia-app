<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Asistencia — Peluquero/A</title>
<style>
  :root{
    --ink:#1B2320;
    --paper:#F5F7F5;
    --card:#FFFFFF;
    --line:#E1E6E2;
    --accent:#0F6B5C;
    --accent-soft:#E4F0EC;
    --absent:#B3483C;
    --absent-soft:#FBEAE7;
    --muted:#6B756F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  header{
    padding:20px 18px 14px; background:var(--ink); color:#fff;
    border-radius:0 0 20px 20px;
  }
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.65; margin-bottom:4px;}
  h1{font-size:19px; margin:0 0 12px; font-weight:700;}
  .meta-row{display:flex; gap:8px; align-items:center;}
  .meta-row select, .meta-row input{
    flex:1; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    color:#fff; border-radius:10px; padding:9px 10px; font-size:13px;
  }
  .meta-row select option{color:#111;}
  .summary-bar{
    display:flex; justify-content:space-between; padding:14px 18px; gap:10px;
  }
  .stat{flex:1; background:var(--card); border-radius:12px; padding:10px 8px; text-align:center; border:1px solid var(--line);}
  .stat .n{font-size:20px; font-weight:800; line-height:1;}
  .stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:3px;}
  .stat.present .n{color:var(--accent);}
  .stat.absent .n{color:var(--absent);}
  .toolbar{display:flex; gap:8px; padding:0 18px 10px;}
  .toolbar button{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:8px; font-size:12.5px; font-weight:600;
  }
  ul.roster{list-style:none; margin:0; padding:0 14px 100px; flex:1;}
  li.student{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;
  }
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
  }
  .name{flex:1; font-size:14.5px; font-weight:600; line-height:1.25;}
  .toggle{
    display:flex; border-radius:10px; overflow:hidden; border:1px solid var(--line); flex-shrink:0;
  }
  .toggle button{
    border:none; padding:8px 12px; font-size:12px; font-weight:700; background:#fff; color:var(--muted);
  }
  .toggle button.active-present{background:var(--accent); color:#fff;}
  .toggle button.active-absent{background:var(--absent); color:#fff;}
  .save-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:linear-gradient(180deg, rgba(245,247,245,0), var(--paper) 30%);
    padding:16px 18px 20px;
  }
  .save-bar button{
    width:100%; background:var(--ink); color:#fff; border:none; border-radius:14px;
    padding:15px; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .save-bar button:active{opacity:.85;}
  .save-bar .status{text-align:center; font-size:12px; color:var(--muted); margin-top:8px; min-height:16px;}
  .loading{padding:40px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Cargando lista de alumnos…</div>
</div>

<script>
const STUDENTS = [
  "AHUMADA ISABEL","BERNALDEZ MARCIA","BERGER ROCIO","CARTAGENA DELIA CAROL",
  "CEJAS GISELE","DE JESUS MELANI GIULIANA","DIAZ EMILY DAKOTA","MARIANI MARIA LAURA",
  "MEINARDI MIRNA ELIZABETH","MIHDI ROMINA ELIZABET","MONTEPIETRO MARIELA SILVINA",
  "MORENO STELLA MARIS","NIMO VIRNA ANABELA","OZAN PABLO OSVALDO","PAVON LUCIA",
  "PETRUZZI PALACIO SANDRA","POGGI BETIANA ALEJANDRA","RODRIGUEZ ROXANA VERONICA",
  "RUARTE FABIANA NOEMI","SAN MILLAN CRISTINA EDITH","SOSA JAZMIN",
  "SPANO MARIA ALEJANDRA","TORRES MARIA FERNANDA"
].map((name, i) => ({ id: 's' + i, name }));

// 👇 Pegá acá la URL que te da Apps Script al implementar (termina en /exec)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw05k9pgLAbOMjz7e0WxHKrC3L5Bg6Iv6SV9K4Hr3-kvu6-VmMIvQKCs_3VvyxiEkE/exec";

const COURSE_ID = "peluquero-a";
let currentDate = new Date().toISOString().slice(0,10);
let attendance = {}; // nombre alumno -> true/false

function initials(name){
  const parts = name.split(' ').filter(Boolean);
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

async function loadForDate(date){
  attendance = {};
  try{
    const url = `${APPS_SCRIPT_URL}?action=attendance&cursoId=${COURSE_ID}&fecha=${date}`;
    const res = await fetch(url);
    const data = await res.json();
    STUDENTS.forEach(s => {
      attendance[s.id] = (s.name in data) ? data[s.name] : true;
    });
  }catch(e){
    // sin conexión o sin registro previo — default todos presentes
    STUDENTS.forEach(s => attendance[s.id] = true);
  }
  render();
}

async function save(){
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const asistenciaPorNombre = {};
  STUDENTS.forEach(s => asistenciaPorNombre[s.name] = attendance[s.id]);

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        cursoId: COURSE_ID,
        fecha: currentDate,
        asistencia: asistenciaPorNombre
      })
    });
    status.textContent = `Guardado ✓ ${formatDate(currentDate)}`;
  }catch(e){
    status.textContent = 'Error al guardar. Revisá tu conexión.';
  }
  btn.disabled = false;
  btn.innerHTML = '💾 Guardar asistencia';
}

function setAll(value){
  STUDENTS.forEach(s => attendance[s.id] = value);
  render();
}

function toggle(id, value){
  attendance[id] = value;
  render();
}

function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-AR', { weekday:'short', day:'2-digit', month:'short' });
}

function render(){
  const presentCount = STUDENTS.filter(s => attendance[s.id]).length;
  const absentCount = STUDENTS.length - presentCount;

  document.getElementById('app').innerHTML = `
    <header>
      <div class="eyebrow">Curso · Sede · Turno</div>
      <h1>Peluquero/A</h1>
      <div class="meta-row">
        <input type="date" id="datePicker" value="${currentDate}">
      </div>
    </header>

    <div class="summary-bar">
      <div class="stat present"><div class="n">${presentCount}</div><div class="l">Presentes</div></div>
      <div class="stat absent"><div class="n">${absentCount}</div><div class="l">Ausentes</div></div>
      <div class="stat"><div class="n">${STUDENTS.length}</div><div class="l">Matrícula</div></div>
    </div>

    <div class="toolbar">
      <button id="allPresent">Marcar todos presentes</button>
      <button id="allAbsent">Marcar todos ausentes</button>
    </div>

    <ul class="roster">
      ${STUDENTS.map(s => `
        <li class="student">
          <div class="avatar">${initials(s.name)}</div>
          <div class="name">${s.name}</div>
          <div class="toggle">
            <button data-id="${s.id}" data-val="true" class="${attendance[s.id] ? 'active-present' : ''}">P</button>
            <button data-id="${s.id}" data-val="false" class="${!attendance[s.id] ? 'active-absent' : ''}">A</button>
          </div>
        </li>
      `).join('')}
    </ul>

    <div class="save-bar">
      <button id="saveBtn">💾 Guardar asistencia</button>
      <div class="status" id="status"></div>
    </div>
  `;

  document.getElementById('datePicker').addEventListener('change', e => {
    currentDate = e.target.value;
    loadForDate(currentDate);
  });
  document.getElementById('allPresent').addEventListener('click', () => setAll(true));
  document.getElementById('allAbsent').addEventListener('click', () => setAll(false));
  document.getElementById('saveBtn').addEventListener('click', save);
  document.querySelectorAll('.toggle button').forEach(btn => {
    btn.addEventListener('click', () => toggle(btn.dataset.id, btn.dataset.val === 'true'));
  });
}

loadForDate(currentDate);
</script>
</body>
</html>
